# =============================================================================
# taxonomy.yaml — the lexicon behind every deterministic decision
# =============================================================================
# Everything here is DATA, not code. If a recruiter wants to add a new role
# family, teach the system a new synonym, or exclude a generic employer token
# that is generating false warm paths, this is the file they edit.
#
# Sections:
#   role_families         title pattern -> family classification
#   family_evidence       skills that confirm a candidate really is in the family
#   skill_synonyms        expansion map for required-skill matching
#   domain_lexicon        keywords that indicate sports / media / broadcast proximity
#   generic_employer_stoplist   employer strings too generic to be a warm signal
#   company_aliases       clusters of employer names that are the same organisation
#   job_family_map        per-job target family (used by src/score.py)
#
# Matching is case-insensitive throughout. Every pattern is a substring match
# on the whitespace-collapsed lowercased target. All patterns are matched in the
# declared order and FIRST HIT WINS (see src/normalize.py).
# =============================================================================

# -----------------------------------------------------------------------------
# Role families — order matters (first-match-wins)
# -----------------------------------------------------------------------------
# Order rationale:
#   1. not_talent first        so "IT Manager" beats a generic "manager" catch
#   2. sales_engineering        so "ML Solutions Architect" != ml_general
#   3. video_broadcast          so "Video Platform Engineer" != platform_devops
#   4. ml_cv                    "Video AI Engineer" is CV, not video_broadcast
#   5. ml_general
#   6. data_engineering
#   7. data_analytics           "Data Analyst" is separate from data_engineering
#   8. platform_devops
#   9. backend                  fallback for generic "Software Engineer"
#   10. product
# -----------------------------------------------------------------------------
role_families:

  - family: not_talent
    title_patterns:
      - "it manager"
      - "it support"
      - "it engineer"
      - "network engineer"        # in this dataset all are telecom, not sports/media
      - "network admin"
      - "systems administrator"
      - "digital marketing"
      - "marketing manager"
      - "sales manager"
      - "account manager"
      - "procurement"
      - "recruiter"
      - "talent acquisition"
      - "hr manager"

  - family: sales_engineering
    # The "vendor archetype" from docs/01. Credible engineers on a pre-sales
    # track. Flag as a different hiring motion; don't silently reject.
    title_patterns:
      - "solutions architect"
      - "solution architect"
      - "sales engineer"
      - "presales"
      - "pre-sales"
      - "customer engineer"

  - family: video_broadcast
    title_patterns:
      - "broadcast engineer"
      - "video streaming"
      - "video systems"
      - "video platform"
      - "senior video engineer"
      - "video engineer"
      - "media delivery"
      - "camera systems"
      - "broadcast systems"
      - "streaming engineer"

  - family: ml_cv
    title_patterns:
      - "computer vision"
      - "cv engineer"
      - "cv research"
      - "video ai"
      - "ml engineer - video"
      - "ml engineer video"
      - "vision engineer"

  - family: ml_general
    title_patterns:
      - "ml engineer"                # generic ML Engineer
      - "ml research"
      - "machine learning engineer"
      - "principal data scientist"
      - "senior data scientist"
      - "data scientist"             # will be re-checked by skills evidence
      - "ai engineer"
      - "applied scientist"
      - "research engineer"

  - family: data_engineering
    title_patterns:
      - "data engineer"
      - "data platform"
      - "analytics engineer"
      - "sports data engineer"
      - "head of data"               # leadership variant (above_band handled elsewhere)
      - "data infrastructure"

  - family: data_analytics
    title_patterns:
      - "data analyst"
      - "bi analyst"
      - "business analyst"
      - "reporting analyst"
      - "analytics analyst"

  - family: platform_devops
    title_patterns:
      - "devops"
      - "site reliability"
      - "sre"
      - "platform engineer"
      - "platform architect"
      - "infrastructure engineer"
      - "cloud engineer"
      - "kubernetes engineer"

  - family: backend
    title_patterns:
      - "backend engineer"
      - "backend developer"
      - "software engineer"
      - "software developer"
      - "senior software"
      - "full stack"
      - "fullstack"
      - "server engineer"

  - family: product
    title_patterns:
      - "product manager"
      - "senior product manager"
      - "product owner"
      - "head of product"
      - "head of technology"          # leadership catch — above_band flagged
      - "director of product"

