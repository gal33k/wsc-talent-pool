# -----------------------------------------------------------------------------
# Skill synonyms — expansion map for required-skill matching
# -----------------------------------------------------------------------------
# Structure: canonical -> { exact: [aliases], family: [broader-family peers] }
# Exact match earns skill_exact_credit (1.0). Family match earns
# skill_family_credit (0.6). Documented in the README so the trade-off is
# visible.
#
# Design call: TensorFlow ~= PyTorch within a "deep_learning" family, but the
# exact skill still earns more. Mason Young (TensorFlow) is matched to a
# PyTorch requirement at 0.6, not 0.0 -- this is why he shows up in the JOB001
# top with a visible "framework mismatch" flag rather than being buried.
# -----------------------------------------------------------------------------
skill_synonyms:

  Python:
    exact: [python]
    family: []

  PyTorch:
    exact: [pytorch]
    family: [tensorflow, keras, jax, mxnet, deep learning]

  TensorFlow:
    exact: [tensorflow]
    family: [pytorch, keras, jax, deep learning]

  "Computer Vision":
    exact: [computer vision, cv, opencv, image processing, video understanding, video ai]
    family: [yolo, pose estimation, sports tracking, highlight detection, video captioning, tracking algorithms]

  "Object Detection":
    exact: [object detection, yolo, tracking algorithms, sports tracking, pose estimation, highlight detection]
    family: [computer vision, video understanding]

  AWS:
    exact: [aws, amazon web services, sagemaker, s3, ec2, lambda]
    family: [gcp, azure]

  GCP:
    exact: [gcp, google cloud]
    family: [aws, azure]

  Go:
    exact: [go, golang]
    family: []

  Kafka:
    exact: [kafka]
    family: [pulsar, kinesis]

  Spark:
    exact: [spark, delta lake, databricks]
    family: [flink, beam]

  dbt:
    exact: [dbt]
    family: []

  Airflow:
    exact: [airflow]
    family: [prefect, dagster]

  SQL:
    exact: [sql, postgresql, mysql, snowflake, bigquery]
    family: []

  Microservices:
    exact: [microservices, rest apis, grpc]
    family: []

  "REST APIs":
    exact: [rest apis, rest api, restful]
    family: [grpc, apis]

  Kubernetes:
    exact: [kubernetes, k8s, helm, eks, gke]
    family: [docker, containers]

  Terraform:
    exact: [terraform, iac]
    family: [pulumi, cloudformation]

  Docker:
    exact: [docker, containers]
    family: [kubernetes]

  Redis:
    exact: [redis]
    family: [memcached]

  FFmpeg:
    exact: [ffmpeg]
    family: [video encoding, video processing]

  "Video streaming":
    exact: [video streaming, hls, dash, live streaming, cdn]
    family: []

  "Product Management":
    exact: [product management, product manager, roadmapping]
    family: []

  "Sports Analytics":
    exact: [sports analytics, sports data, sports cv, sports tracking, football analytics, sports science, sports video]
    family: []

  "API Products":
    exact: [api products, apis, broadcast apis, rest apis]
    family: []

  "Stakeholder Management":
    exact: [stakeholder management]
    family: []

  "Real-time processing":
    exact: [real-time processing, real-time, real time, real-time sports data, real-time processing]
    family: [streaming, kafka]

  "OTT platforms":
    exact: [ott, ott streaming, ott platforms, ott platform]
    family: []

  "Broadcast tech":
    exact: [broadcast, broadcast systems, broadcast equipment, broadcast media, broadcast technology]
    family: []

  "Sports domain knowledge":
