# -----------------------------------------------------------------------------
# Generic-employer stoplist — the ~40 false warm paths finding
# -----------------------------------------------------------------------------
# Case-insensitive EXACT match on the trimmed employer string. Bare tokens
# like "startup" or "freelance" appear on both sides of the warm-path join and
# would generate false positives; specific variants like "IDF Intelligence
# Unit" or "Basel University" are NOT in this list and survive.
#
# See docs/01-data-findings.md § "Implementation trap — generic employer tokens"
# -----------------------------------------------------------------------------
generic_employer_stoplist:
  - freelance
  - freelance developer
  - freelance sports analyst
  - freelance developer (2021-2022)
  - startup
  - food startup
  - farming startup
  - shipping startup
  - fintech startup
  - betting startup
  - pet retail chain
  - private clinic
  - law firm
  - Dublin law firm IT dept
  - public sector
  - agency
  - NGO
  - factory group
  - retail
  - retailer
  - Hospital group
  - hospital group
  - Hospital Group
  - fintech
  - university             # bare only; "Basel University", "Oxford Research Lab" survive
  - univ
  - uni

# -----------------------------------------------------------------------------
# Company aliases — clusters of names that are the same organisation
# -----------------------------------------------------------------------------
# Warm-path matching normalises both sides to the alias's canonical key before
# comparing. Without this, "Opta Sports" (attendee) and "Stats Perform" (WSC
# employee) never match, and the doc-expected paths for Marcus Reid / James
# Thornton / Jin Park disappear.
#
# Rule: only cluster when the entities really are the same. Sky Sports and
# Sky Italia are DIFFERENT subsidiaries and are NOT clustered.
# -----------------------------------------------------------------------------
company_aliases:
  IDF:
    - IDF
    - IDF tech unit
    - IDF Intelligence Unit
  "Opta / Stats Perform":
    - Opta
    - Opta Sports
    - Stats Perform
    - Stats Perform / Opta
  Akamai:
    - Akamai
    - Akamai Technologies
    - Akamai Media
  Intel:
    - Intel
    - Intel Computer Vision Lab
  "Sky Sports":
    - Sky Sports
    - Sky Sports Digital
  "BBC Sport":
    - BBC Sport
    - BBC Sport Online
  ESPN:
    - ESPN
    - ESPN Technology

# -----------------------------------------------------------------------------
# Job -> target family map
# -----------------------------------------------------------------------------
# The role_family component of fit_score compares the candidate's family
# against the job's target family. Declared here so a new job needs only
# CSV + config, not code.
# -----------------------------------------------------------------------------
job_family_map:
  JOB001: ml_cv              # Senior ML Engineer — required skills lock this to CV
  JOB002: backend
  JOB003: product
  JOB004: data_engineering
